services:
  - type: web
    name: contexora-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # User will provide this in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_REWRITE_MODEL
        value: llama-3.1-8b-instant
      - key: CAPTION_PROVIDER
        value: blip
      - key: QDRANT_URL
        sync: false # User will provide this in Render dashboard
      - key: QDRANT_API_KEY
        sync: false # User will provide this in Render dashboard
